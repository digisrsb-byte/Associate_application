<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASSOCIATE — Offline</title>
    <style>
      :root {
        --ink: #14132a;
        --muted: #5c5a72;
        --card: #f7f7fb;
        --navy: #1a1840;
        --line: #d8d6e5;
        --danger: #b42318;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #e4e6f0;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 480px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        color: var(--navy);
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .err {
        color: var(--danger);
        font-size: 0.9rem;
        margin-bottom: 16px;
      }
      button {
        border: 0;
        background: var(--navy);
        color: #fff;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
      }
      code {
        font-size: 0.8rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cannot reach the application server</h1>
      <p>
        The desktop app does not store business data offline and will not write
        locally. Check your network connection, then retry.
      </p>
      <p class="err" id="detail"></p>
      <p>Target: <code id="url"></code></p>
      <button type="button" id="retry">Retry connection</button>
    </main>
    <script>
      (async () => {
        const info = await window.associateDesktop.getShellInfo();
        document.getElementById('detail').textContent =
          info.loadError || 'Network unavailable.';
        document.getElementById('url').textContent = info.appUrl || '—';
        document.getElementById('retry').onclick = () => {
          window.associateDesktop.retryLoad();
        };
      })();
    </script>
  </body>
</html>
